services:
  - type: web
    name: aura-assistant
    runtime: docker
    repo: https://github.com/099bhuvan/AURA999
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: AI_DEFAULT_MODE
        value: online
      - key: ONLINE_API_KEY
        sync: false
      - key: ONLINE_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: ONLINE_MODEL_NAME
        value: gemini-2.5-flash
      - key: REDUCED_MOTION
        value: "false"
